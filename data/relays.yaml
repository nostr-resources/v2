  - name: nostr.info relays
    url: https://nostr.info/relays/
    group: directories
    tags: [directory, public-relays]
    description:
      en: Directory of known Nostr relays
      de: Verzeichnis bekannter Nostr-Relays

  - name: relay.tools
    url: https://relay.tools/
    group: directories
    tags: [directory, public-relays]
    description:
      en: Public relay browser
      de: Offentlicher Relay-Browser

  - name: Nostr Relay server guide
    url: https://andreneves.xyz/p/set-up-a-nostr-relay-server-in-under
    group: run
    tags: [guide, self-hosting]
    description:
      en: Set up a Nostr relay server in under 5 minutes
      de: Nostr Relay Server in unter 5 Minuten aufsetzen

  - name: Citrine
    url: https://github.com/greenart7c3/Citrine?tab=readme-ov-file#download
    group: run
    platforms: [Android]
