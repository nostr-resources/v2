{{ $type := .Get 0 | default "free" }}
<ul>
  {{ range site.Data.nip05providers }}
    {{ if and (eq $type "free") (not .price) }}
    <li><a href="{{ .link | safeURL }}">{{ .name }}</a></li>
    {{ else if and (eq $type "paid") .price }}
    <li><a href="{{ .link | safeURL }}">{{ .name }}</a> ({{ .price }})</li>
    {{ end }}
  {{ end }}
</ul>
